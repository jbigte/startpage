<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>

<style>

body{
  margin:0;
  background:#0f0f10;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  padding:30px;
}

/* 4-column grid starting top-left */

.grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:22px;
  max-width:900px;
}

/* tiles */

.tile{
  background:#1b1b1d;
  border-radius:18px;
  padding:22px 12px;
  text-align:center;
  text-decoration:none;
  color:white;
  box-shadow:0 5px 14px rgba(0,0,0,0.35);
  transition:transform .08s ease, background .12s ease;
}

/* Inverts the McSweeney's icon specifically */
.tile[href*="mcsweeneys.net"] img {
  filter: invert(1);
}

.tile:active{
  transform:scale(.95);
  background:#2a2a2c;
}

.tile img{
  width:60px;
  height:60px;
  margin-bottom:10px;
}

.label{
  font-size:15px;
  line-height:1.2;
}

</style>
</head>

<body>

<div class="grid">

<a class="tile" href="https://swissinfo.ch">
<img src="https://icons.duckduckgo.com/ip3/swissinfo.ch.ico">
<div class="label">Swissinfo</div>
</a>

<a class="tile" href="https://kottke.org">
<img src="https://icons.duckduckgo.com/ip3/kottke.org.ico">
<div class="label">Kottke</div>
</a>

<a class="tile" href="https://austinkleon.com">
<img src="https://icons.duckduckgo.com/ip3/austinkleon.com.ico">
<div class="label">Austin Kleon</div>
</a>

<a class="tile" href="https://www.laphamsquarterly.org">
<img src="https://icons.duckduckgo.com/ip3/laphamsquarterly.org.ico">
<div class="label">Lapham's Quarterly</div>
</a>

<a class="tile" href="https://www.mcsweeneys.net">
<img src="https://icons.duckduckgo.com/ip3/mcsweeneys.net.ico">
<div class="label">McSweeney's</div>
</a>

<a class="tile" href="https://www.aldaily.com">
<img src="https://icons.duckduckgo.com/ip3/aldaily.com.ico">
<div class="label">Arts & Letters</div>
</a>

<a class="tile" href="https://www.npr.org">
<img src="https://icons.duckduckgo.com/ip3/npr.org.ico">
<div class="label">NPR</div>
</a>

<a class="tile" href="https://www.cbc.ca">
<img src="https://icons.duckduckgo.com/ip3/cbc.ca.ico">
<div class="label">CBC</div>
</a>

<a class="tile" href="https://www.meteosuisse.ch">
<img src="https://icons.duckduckgo.com/ip3/meteosuisse.ch.ico">
<div class="label">MeteoSwiss</div>
</a>

<a class="tile" href="https://www.google.ch/maps/@46.5,6.5,11z?hl=en">
<img src="https://icons.duckduckgo.com/ip3/maps.google.com.ico">
<div class="label">Google Maps</div>
</a>

</div>

</body>
</html>
